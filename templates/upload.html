{% extends "layout.html" %}

{% block title %}Upload | QuantChip{% endblock %}

{% block content %}
<div class="container">
  <p>Upload your PokerStars hand history to begin.</p>

  <form action="/" method="post" enctype="multipart/form-data">
    <input type="text" name="hero_name" class="auth-input" placeholder="Enter Your PokerStars Username" required>

    <!-- File upload -->
    <label class="upload-box">
      <input type="file" name="file_input" accept=".txt,.csv,.log">
      <span>Click to upload a file</span>
    </label>
    <button type="submit" name="action" value="file">Submit File</button>

    <!-- Paste box -->
    <div class="paste-area">
      <textarea name="paste_input" placeholder="Or paste PokerStars data here..."></textarea>
      <button type="submit" name="action" value="paste">Submit Paste</button>
    </div>
  </form>
</div>
{% endblock %}
